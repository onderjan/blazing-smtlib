[package]
name = "blazing-smtlib"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.88"
description = "Fast, safe, dependency-free SMT-LIB parsing"
license = "MIT OR Apache-2.0"
repository = "https://github.com/onderjan/blazing-smtlib"
readme = "README.md"
keywords = ["smt-lib", "smt", "lexer", "parser", "solver"]
categories = ["parser-implementations"]

[dependencies]

[dev-dependencies]
rayon = "1.11.0"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "census"
harness = false

[profile.bench]
debug = true
[[bench]]
name = "compare"
harness = false
