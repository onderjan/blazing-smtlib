name = "blazing-smtlib"
defaultTargets = ["BSmtLib", "BSmtLibSpec", "BSmtLibSpecChecks", "BSmtLibProofs", "BSmtLibParserProofs",
  "BSmtLibEndToEnd"]

[[lean_lib]]
name = "BSmtLib"

# the trusted specification of SMT-LIB
[[lean_lib]]
name = "BSmtLibSpec"
roots = ["BSmtLib.Spec"]

# checks of the specification against the standard's examples; not trusted
[[lean_lib]]
name = "BSmtLibSpecChecks"
roots = ["BSmtLib.SpecChecks"]

# the chain of lexers that leads from the specification to the library's lexer
[[lean_lib]]
name = "BSmtLibProofs"
roots = ["BSmtLib.Proofs"]

# the lexing mode of rust/benches/parse.rs, run with `lake exe bench-parse`
[[lean_exe]]
name = "bench-parse"
root = "Benches.Parse"

# the proofs of the parser against the specification's traversal
[[lean_lib]]
name = "BSmtLibParserProofs"
roots = ["BSmtLib.ParserProofs"]

# the composition of the lexer and parser proofs, from characters to the traversal's calls
[[lean_lib]]
name = "BSmtLibEndToEnd"
roots = ["BSmtLib.EndToEnd"]
