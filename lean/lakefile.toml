name = "blazing-smtlib"
defaultTargets = ["BSmtLib", "BSmtLibSpec", "BSmtLibSpecFacts", "BSmtLibFacts"]

# the library
[[lean_lib]]
name = "BSmtLib"

# the trusted specification of SMT-LIB
[[lean_lib]]
name = "BSmtLibSpec"
roots = ["BSmtLibSpec"]

# what the specification satisfies by itself, and its checks against the standard's examples;
# not trusted
[[lean_lib]]
name = "BSmtLibSpecFacts"
roots = ["BSmtLibSpec.Facts"]

# what the library satisfies with respect to the specification: the lexers, the parsers and the
# readers; the chain of lexers from the specification to the library's lexer is built with it
[[lean_lib]]
name = "BSmtLibFacts"
roots = ["BSmtLib.Facts", "BSmtLib.Facts.Names"]

# the lexing mode of rust/benches/parse.rs, run with `lake exe bench-parse`
[[lean_exe]]
name = "bench-parse"
root = "Benches.Parse"

# writes the generated module of re-exports, `BSmtLib/Reexports.lean`, run with
# `lake exe reexports`
[[lean_exe]]
name = "reexports"
root = "BSmtLib.Facts.WriteReexports"
