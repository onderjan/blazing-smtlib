# The driver protocol answered by the Lean lexer and parser, see
# lean/driver-protocol.md. Not part of the library package.
name = "lean-driver"
defaultTargets = ["lean-driver"]

[[require]]
name = "blazing-smtlib"
path = "../../lean"

# The modules of the driver besides its root.
[[lean_lib]]
name = "LeanDriver"
roots = ["Protocol", "Parse"]

[[lean_exe]]
name = "lean-driver"
root = "Main"
